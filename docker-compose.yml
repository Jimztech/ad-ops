services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adpilot
      POSTGRES_PASSWORD: adpilot
      POSTGRES_DB: adpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
  mongodata: